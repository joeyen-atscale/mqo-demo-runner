[package]
name = "mqo-demo-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Guided demo runner for the AtScale MQO ethical-AI toolchain"
license = "MIT"

[[bin]]
name = "mqo-demo-runner"
path = "src/main.rs"

[lib]
name = "mqo_demo_runner"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigpipe = "0.1"

[dev-dependencies]
